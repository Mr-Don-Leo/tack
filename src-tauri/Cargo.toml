[package]
name = "tack"
version = "0.1.0"
description = "Boards, tasks, reminders and automations for the desktop"
authors = ["Tack"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "tack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tack"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
notify-rust = "4.17.0"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
