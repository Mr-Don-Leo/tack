# Builds installers for every supported platform and publishes them as a
# GitHub release.
#
# Tauri cannot cross-compile: a Windows bundle needs the MSVC toolchain and the
# WebView2 SDK, and a macOS bundle needs Xcode's codesign and hdiutil. So each
# platform is built on its own runner.
#
# The release is created once up front and stays a draft until every build has
# uploaded to it, so a single failing platform can never publish a release that
# is missing an installer.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build, e.g. v0.1.0"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # The id comes straight out of the create call. Creating the release
          # and then listing releases to find it again races GitHub's
          # read-after-write lag, and an empty id is not a loud failure:
          # tauri-action turns it into 0, skips every upload and still exits 0.
          if body=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                      -f tag_name="$TAG" \
                      -f target_commitish="$GITHUB_SHA" \
                      -f name="Tack $TAG" \
                      -f body="Installers for Linux, macOS and Windows are attached below." \
                      -F draft=true 2>&1); then
            id=$(jq -r '.id // empty' <<<"$body")
          else
            # Expected on a re-run, where the release already exists. Anything
            # else is printed so it does not have to be guessed at later.
            echo "could not create the release, falling back to a lookup:"
            echo "$body"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                   --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          fi

          if [ -z "$id" ]; then
            echo "::error::could not create or find a release for $TAG"
            exit 1
          fi
          echo "resolved release id $id for $TAG"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel get a DMG each rather than one universal
          # binary: a universal build has to happen on a single runner and
          # doubles its size, and two downloads are cheaper than that.
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails before spending minutes on the Rust side, and runs the
      # recurrence / quick-add parsing / path-safety tests.
      - run: npx tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # tauri-action treats a missing releaseId as "nothing to upload" and
      # still succeeds, which would leave a green run and an empty release.
      - name: Require a release to upload to
        shell: bash
        run: |
          test -n "${{ needs.create-release.outputs.release_id }}" \
            || { echo "::error::release_id is empty"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ships its own binutils, which is older than the
          # `.relr.dyn` sections current distributions emit and aborts the
          # AppImage on them. Distro libraries arrive stripped anyway, so
          # skipping the step costs nothing. Ignored on macOS and Windows.
          NO_STRIP: true
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: tack-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: error

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          # Publishing a release with no installers on it is worse than leaving
          # the draft for someone to look at.
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets | length')
          echo "release $RELEASE_ID has $count asset(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::every build succeeded but nothing was attached; leaving the release as a draft"
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
